[pytest]
testpaths = tests
pythonpath = .

addopts = -q --strict-markers

markers =
    integration: touches the real Postgres test database via the HTTP API
    unit: fast tests with no external dependencies

filterwarnings =
    error::DeprecationWarning:app.*

[coverage:run]
source = app
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
