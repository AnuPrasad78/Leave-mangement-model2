services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: leave_app
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-root_345}
      POSTGRES_DB: leave_portal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave_app -d leave_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://leave_app:${POSTGRES_ADMIN_PASSWORD:-root_345}@db:5432/leave_portal
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ACCESS_TOKEN_MINUTES: "720"
      CORS_ORIGINS: http://localhost:80,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:80:80"

volumes:
  postgres_data: